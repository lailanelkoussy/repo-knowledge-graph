openapi: 3.0.3
info:
  title: Catalog
  version: '2.0'
servers:
  - url: http://localhost:8080/v2
tags:
  - name: catalog-v2
    description: Products of the catalog.
paths:
  /products:
    get:
      tags: [catalog-v2]
      operationId: listProducts
      summary: Lists the products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [catalog-v2]
      operationId: createProduct
      summary: Creates a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [catalog-v2]
      operationId: getProduct
      summary: Returns one product
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
    delete:
      tags: [catalog-v2]
      operationId: deleteProduct
      deprecated: true
      responses:
        '204':
          description: Deleted
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Up
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
