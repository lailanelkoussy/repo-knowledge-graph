name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6" "mypy>=1.10"
      - run: ruff check .
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Hermetic run: models are replaced by a fake service (tests/conftest.py), torch is not needed
      - run: pip install -e ".[cpp,dev]"
      - run: pytest -q

  weaviate:
    runs-on: ubuntu-latest
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.36.24
        ports: ["8080:8080", "50051:50051"]
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: none
          ENABLE_MODULES: ""
          CLUSTER_HOSTNAME: node1
    env:
      WEAVIATE_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[weaviate,dev]"
      - name: Wait for Weaviate
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/v1/.well-known/ready && exit 0; sleep 2; done; exit 1
      - run: pytest -q -m weaviate
